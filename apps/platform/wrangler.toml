name = "openthink-platform"
main = "src/worker/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# account_id is intentionally blank — wrangler picks it up from the active CF
# auth at deploy time (`wrangler login`). Each user's deploy fills it in.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# ----- Durable Objects -----
[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "Orchestrator"

[[durable_objects.bindings]]
name = "RESEARCHER"
class_name = "Researcher"

[[durable_objects.bindings]]
name = "CODER"
class_name = "Coder"

[[durable_objects.bindings]]
name = "MEMORY_AGENT"
class_name = "MemoryAgent"

[[durable_objects.bindings]]
name = "JUDGE"
class_name = "Judge"

[[durable_objects.bindings]]
name = "BROWSER_SESSION"
class_name = "BrowserSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Orchestrator", "Researcher", "Coder", "MemoryAgent", "Judge", "BrowserSession"]

# ----- D1 -----
# database_id is a per-user value. The string below is a shape-valid UUID
# placeholder; wrangler accepts it in local mode (miniflare emulator) but
# the production deploy step (DEPLOY.md) replaces it with the real ID from
# `wrangler d1 create openthink`.
[[d1_databases]]
binding = "DB"
database_name = "openthink"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "../../migrations"

# ----- R2 -----
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "openthink-artifacts"

# ----- KV -----
# `id` is per-user; shape-valid 32-hex placeholder used for local dev only.
[[kv_namespaces]]
binding = "SETTINGS"
id = "0000000000000000000000000000ffff"

# ----- Vectorize -----
# Vectorize has no local emulator. Comment-out for local dev; uncomment +
# replace `index_name` with the output of `wrangler vectorize create` for
# production deploys.
# [[vectorize]]
# binding = "MEMORIES"
# index_name = "openthink-memories"

# ----- Queues -----
[[queues.producers]]
binding = "TRAJECTORIES"
queue = "openthink-trajectories"

[[queues.consumers]]
queue = "openthink-trajectories"
max_batch_size = 25
max_batch_timeout = 30

# ----- Workflows -----
[[workflows]]
binding = "GOAL_WORKFLOW"
name = "openthink-goal"
class_name = "GoalWorkflow"

[[workflows]]
binding = "RETRAIN_WORKFLOW"
name = "openthink-retrain"
class_name = "RetrainingWorkflow"

[triggers]
crons = ["0 8 * * *"]

# ----- Workers AI -----
[ai]
binding = "AI"

# ----- Browser Rendering -----
# Browser Rendering has no local emulator. Wrangler dev refuses to boot if it
# sees `[browser]`. Uncomment for production deploys; the BrowserSession DO
# lazy-imports @cloudflare/puppeteer and skips screenshot capture when the
# binding isn't reachable, so local dev is fine without it.
# [browser]
# binding = "BROWSER"

[vars]
OPENTHINK_VERSION = "0.1.0"
